<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message for My Best Friend</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f2f2f2;
      padding: 50px;
    }
    h1 {
      color: #4CAF50;
    }
    p {
      font-size: 20px;
      color: #333;
    }
    .music {
      margin-top: 30px;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100px;
    }
  </style>
</head>
<body>
  <h1>Hey [Best Friend's Name],</h1>
  <p>I just want you to know that I'm so lucky to have you in my life. Through all the ups and downs, we've always had each other's backs. Here's a little something for you!</p>
  
  <div class="music">
    <p>Here's a song that reminds me of our friendship:</p>
    <!-- Example of a music embed (from YouTube) -->
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
  
  <p>Thanks for being such an amazing friend! 🎶</p>
</body>
</html>
